<title>Mjadala</title>
<style>
  :root { --green:#0b6b4f; --bg:#efeae2; --card:#fff; --mine:#d9fdd3; --text:#111b21; --muted:#667781; }
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--text); background:var(--bg); }
  button { font:inherit; cursor:pointer; border:0; }
  input { font:inherit; }
  .screen { display:none; height:100dvh; flex-direction:column; }
  .screen.active { display:flex; }
  header { background:var(--green); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px; padding-top:calc(12px + env(safe-area-inset-top)); }
  header h1 { font-size:18px; flex:1; }
  header small { opacity:.8; font-size:12px; display:block; font-weight:400; }
  header button { background:transparent; color:#fff; font-size:20px; padding:4px 8px; }
  header button.txt { font-size:13px; border:1px solid rgba(255,255,255,.6); border-radius:14px; padding:4px 10px; }
  #auth { justify-content:center; align-items:center; padding:20px; background:var(--green); }
  .auth-card { background:#fff; border-radius:14px; padding:22px; width:100%; max-width:380px; }
  .auth-card h2 { color:var(--green); margin-bottom:4px; }
  .auth-card p { color:var(--muted); font-size:14px; margin-bottom:14px; }
  .auth-card input { width:100%; padding:12px; border:1px solid #ccd; border-radius:8px; margin-bottom:10px; }
  .primary { background:var(--green); color:#fff; padding:12px; border-radius:8px; width:100%; font-weight:600; }
  .primary:disabled { opacity:.6; }
  .link { background:none; color:var(--green); margin-top:10px; width:100%; }
  .err { color:#b3261e; font-size:13px; min-height:18px; margin-bottom:6px; }
  .copy { text-align:center; margin:12px 0 0 !important; font-size:12px !important; }
  .copy a, .agree a { color:var(--green); }
  .agree { display:none; font-size:13px; color:var(--muted); margin-bottom:10px; line-height:1.4; }
  .auth-card .agree input { width:auto; margin:0 8px 0 0; vertical-align:middle; }
  #roomlist { flex:1; overflow-y:auto; }
  .room { background:var(--card); padding:14px; border-bottom:1px solid #eee; display:block; width:100%; text-align:left; }
  .room b { display:block; }
  .room span { color:var(--muted); font-size:13px; }
  .fab { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); background:var(--green); color:#fff; border-radius:28px; padding:14px 18px; font-weight:600; box-shadow:0 3px 10px rgba(0,0,0,.25); }
  .rules { background:#fff8e1; color:#5d4a00; font-size:12px; padding:8px 14px; }
  .banned { background:#fdecea; color:#b3261e; font-size:13px; padding:8px 14px; display:none; }
  #msgs { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:82%; background:var(--card); padding:7px 10px; border-radius:10px; align-self:flex-start; word-wrap:break-word; overflow-wrap:anywhere; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .msg.mine { background:var(--mine); align-self:flex-end; }
  .msg.hidden-msg { opacity:.5; }
  .msg .who { font-size:12px; font-weight:700; color:var(--green); }
  .msg .meta { font-size:11px; color:var(--muted); display:flex; gap:10px; justify-content:flex-end; margin-top:2px; }
  .msg .meta button { background:none; color:var(--muted); font-size:11px; text-decoration:underline; }
  .sys { align-self:center; font-size:12px; color:var(--muted); background:#e1f2fb; padding:4px 10px; border-radius:8px; }
  form#send { display:flex; gap:8px; padding:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom)); background:#f0f2f5; }
  form#send input { flex:1; padding:12px; border:0; border-radius:22px; }
  form#send button { background:var(--green); color:#fff; border-radius:50%; width:46px; height:46px; font-size:18px; }
  #install { display:none; background:#fff; color:var(--green) !important; font-size:13px !important; font-weight:600; padding:6px 10px !important; border-radius:16px; }
  .tabs { display:flex; background:#fff; border-bottom:1px solid #ddd; }
  .tabs button { flex:1; padding:12px 6px; background:none; color:var(--muted); font-weight:600; border-bottom:3px solid transparent; }
  .tabs button.on { color:var(--green); border-bottom-color:var(--green); }
  #adminbody { flex:1; overflow-y:auto; padding:10px; }
  #adminbody input[type=text], #adminbody input[type=number], #adminbody input[type=search] { width:100%; padding:10px; border:1px solid #ccd; border-radius:8px; margin-bottom:8px; }
  .card { background:var(--card); border-radius:10px; padding:12px; margin-bottom:10px; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .card h4 { font-size:15px; margin-bottom:2px; }
  .card .sub { font-size:12px; color:var(--muted); }
  .card .body { margin:6px 0; overflow-wrap:anywhere; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .btn { padding:8px 12px; border-radius:8px; background:#eef2f1; color:var(--text); font-size:13px; font-weight:600; }
  .btn.danger { background:#fdecea; color:#b3261e; }
  .btn.good { background:var(--green); color:#fff; }
  .btn:disabled { opacity:.5; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#eef2f1; color:var(--muted); margin-left:6px; font-weight:600; }
  .tag.red { background:#fdecea; color:#b3261e; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; font-size:14px; }
  .code { font-size:22px; font-weight:800; letter-spacing:2px; color:var(--green); }
</style>
</head>
<body>

<!-- LOGIN / SIGN UP -->
<section id="auth" class="screen active">
  <div class="auth-card">
    <h2>Mjadala</h2>
    <p>Discuss what matters. Use a nickname, not your real name.</p>
    <input id="u" placeholder="Nickname (3-20 letters/numbers)" autocomplete="username" autocapitalize="none">
    <input id="p" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <input id="invite" placeholder="Invite code" autocapitalize="characters" autocomplete="off" style="display:none">
    <label class="agree" id="agree"><input type="checkbox" id="agreebox">I am 18 or older and I agree to the <a href="/terms.html#terms" target="_blank">Terms</a> and <a href="/terms.html#privacy" target="_blank">Privacy Policy</a>.</label>
    <div class="err" id="autherr"></div>
    <button class="primary" id="authbtn">Log in</button>
    <button class="link" id="authswitch">New here? Create an account</button>
    <p class="copy">&copy; 2026 Mark Sixstars &middot; <a href="/terms.html#terms" target="_blank">Terms</a> &middot; <a href="/terms.html#privacy" target="_blank">Privacy</a></p>
  </div>
</section>

<!-- ROOM LIST -->
<section id="rooms" class="screen">
  <header>
    <h1>Mjadala<small id="me"></small></h1>
    <button id="install">Install app</button>
    <button class="txt" id="adminbtn" style="display:none">Admin</button>
    <button class="txt" id="logout">Log out</button>
  </header>
  <div class="banned" id="bannedbar">Your account is restricted. You can read but not post.</div>
  <div class="rules">Be respectful. Argue with facts, not insults. Report abuse with the Report link on a message.</div>
  <div id="roomlist"></div>
  <button class="fab" id="newroom">+ New room</button>
</section>

<!-- CHAT -->
<section id="chat" class="screen">
  <header>
    <button id="back">←</button>
    <h1><span id="roomname"></span><small id="online"></small></h1>
    <button class="txt" id="delroom" style="display:none">Delete room</button>
  </header>
  <div id="msgs"></div>
  <form id="send">
    <input id="text" placeholder="Type a message" maxlength="500" autocomplete="off">
    <button type="submit">➤</button>
  </form>
</section>

<!-- ADMIN PANEL (admins and moderators) -->
<section id="admin" class="screen">
  <header>
    <button id="adminback">←</button>
    <h1>Admin panel<small id="adminwho"></small></h1>
  </header>
  <div class="tabs">
    <button data-tab="reports" class="on">Reports</button>
    <button data-tab="people">People</button>
    <button data-tab="invites" id="tabinvites">Invites</button>
  </div>
  <div id="adminbody"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Copyright (c) 2026 Mark Sixstars. All rights reserved.
// These two values are PUBLIC by design (the database rules protect the data).
// NEVER put a "service_role" or secret key in this file.
const SUPABASE_URL = "https://olqwfscmhtdseljvfqvm.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ay8LXBjvNhXQJDKQMF_Etw_SMb6_z4M";
// People log in with a nickname; behind the scenes it becomes nickname@AUTH_DOMAIN
const AUTH_DOMAIN = "mjadala.app";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let me = null;              // { id, nickname, role, is_banned }
let mode = "login";
let currentRoom = null, channel = null;
const nameCache = {};       // author id -> nickname

const isStaff = () => me && (me.role === "admin" || me.role === "moderator");
const toEmail = nick => nick.trim().toLowerCase() + "@" + AUTH_DOMAIN;

function show(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(name).classList.add("active");
}

function friendly(e) {
  const m = (e && e.message) || "Something went wrong";
  if (/already registered/i.test(m)) return "That nickname is taken";
  if (/database error saving new user/i.test(m)) return "That nickname is taken or not allowed, or the invite code was just used up";
  if (/could not find the function|schema cache/i.test(m)) return "Admin tools are not installed yet. Run the database update in Supabase first.";
  if (/invalid login/i.test(m)) return "Wrong nickname or password";
  if (/failed to fetch|network/i.test(m)) return "No internet connection";
  return m;
}

/* ---------- Auth ---------- */
let needInvite = false;
async function refreshInviteRule() {
  // Asks the database whether sign-up currently needs an invite code.
  // If the question fails (for example the update was not installed), sign-up stays open.
  const { data, error } = await sb.rpc("signup_needs_invite");
  needInvite = !error && data === true;
  $("invite").style.display = (mode === "register" && needInvite) ? "block" : "none";
}

function setMode(m) {
  mode = m;
  $("authbtn").textContent = mode === "login" ? "Log in" : "Create account";
  $("authswitch").textContent = mode === "login" ? "New here? Create an account" : "Have an account? Log in";
  $("agree").style.display = mode === "register" ? "block" : "none";
  if (mode === "register") refreshInviteRule(); else $("invite").style.display = "none";
  $("autherr").textContent = "";
}
$("authswitch").onclick = () => setMode(mode === "login" ? "register" : "login");

$("authbtn").onclick = async () => {
  $("autherr").textContent = "";
  $("authbtn").disabled = true;
  try {
    const nick = $("u").value.trim(), pw = $("p").value;
    if (!/^[A-Za-z0-9_]{3,20}$/.test(nick)) throw new Error("Nickname: 3-20 letters, numbers or underscore");
    if (pw.length < 6) throw new Error("Password must be at least 6 characters");
    if (mode === "register") {
      if (!$("agreebox").checked) throw new Error("Please tick the box to agree to the Terms and Privacy Policy");
      await refreshInviteRule();
      const code = $("invite").value.trim().toUpperCase();
      if (needInvite) {
        if (!code) throw new Error("You need an invite code to join. Ask the person who shared Mjadala with you.");
        const { data: valid } = await sb.rpc("check_invite", { p_code: code });
        if (valid !== true) throw new Error("That invite code is not valid, or it has been used up");
      }
      // _ is a wildcard in ilike, so escape it to match exactly
      const { data: taken } = await sb.from("profiles").select("id").ilike("nickname", nick.replace(/_/g, "\\_")).limit(1);
      if (taken && taken.length) throw new Error("That nickname is taken");
      const { data, error } = await sb.auth.signUp({ email: toEmail(nick), password: pw, options: { data: { nickname: nick, invite_code: code } } });
      if (error) throw error;
      if (!data.session) throw new Error("Account created, but email confirmation is still ON in Supabase. Turn it off, then log in.");
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: toEmail(nick), password: pw });
      if (error) throw error;
    }
    await start();
  } catch (e) {
    $("autherr").textContent = friendly(e);
  } finally {
    $("authbtn").disabled = false;
  }
};

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show("auth"); return; }
  const { data: p, error } = await sb.from("profiles").select("id, nickname, role, is_banned").eq("id", session.user.id).maybeSingle();
  if (error || !p) { await sb.auth.signOut(); show("auth"); return; }
  me = p; nameCache[p.id] = p.nickname;
  openRooms();
}

$("logout").onclick = async () => {
  leaveChannel();
  await sb.auth.signOut();
  me = null; currentRoom = null;
  $("p").value = "";
  setMode("login");
  show("auth");
};

/* ---------- Rooms ---------- */
async function openRooms() {
  leaveChannel();
  currentRoom = null;
  $("me").textContent = "Signed in as " + me.nickname + (isStaff() ? " (" + me.role + ")" : "");
  $("bannedbar").style.display = me.is_banned ? "block" : "none";
  $("adminbtn").style.display = isStaff() ? "inline-block" : "none";
  show("rooms");
  const { data, error } = await sb.from("rooms").select("id, name, description, created_by").order("id", { ascending: true });
  $("roomlist").innerHTML = "";
  if (error) { $("roomlist").textContent = friendly(error); return; }
  data.forEach(r => {
    const b = document.createElement("button");
    b.className = "room";
    b.innerHTML = "<b></b><span></span>";
    b.children[0].textContent = r.name;
    b.children[1].textContent = r.description || "";
    b.onclick = () => openChat(r);
    $("roomlist").appendChild(b);
  });
}

$("newroom").onclick = async () => {
  const name = (prompt("Room name (3-40 characters)") || "").trim();
  if (!name) return;
  const description = (prompt("One line about the room (optional)") || "").trim().slice(0, 120);
  const { error } = await sb.from("rooms").insert({ name, description, created_by: me.id });
  if (error) { alert(error.code === "23505" ? "A room with that name exists" : friendly(error)); return; }
  openRooms();
};

/* ---------- Chat ---------- */
function sysMsg(text) {
  const d = document.createElement("div"); d.className = "sys"; d.textContent = text;
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}
function removeMsg(id) { const el = document.querySelector('.msg[data-id="' + id + '"]'); if (el) el.remove(); }
function hideMsg(id) {
  const el = document.querySelector('.msg[data-id="' + id + '"]');
  if (!el) return;
  if (isStaff()) el.classList.add("hidden-msg"); else el.remove();
}
async function nickOf(id) {
  if (nameCache[id]) return;
  const { data } = await sb.from("profiles").select("nickname").eq("id", id).maybeSingle();
  nameCache[id] = (data && data.nickname) || "unknown";
}

function addMsg(m) {
  if (document.querySelector('.msg[data-id="' + m.id + '"]')) return;   // no duplicates
  const mine = m.author_id === me.id;
  const div = document.createElement("div");
  div.className = "msg" + (mine ? " mine" : "") + (m.is_hidden ? " hidden-msg" : "");
  div.dataset.id = m.id;
  const who = document.createElement("div"); who.className = "who"; who.textContent = nameCache[m.author_id] || "unknown";
  const body = document.createElement("div"); body.textContent = m.body;   // textContent = safe from HTML injection
  const meta = document.createElement("div"); meta.className = "meta";
  const t = document.createElement("span");
  t.textContent = new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  meta.appendChild(t);
  if (!mine) {
    const rep = document.createElement("button"); rep.textContent = "Report";
    rep.onclick = async () => {
      const { error } = await sb.from("reports").insert({ message_id: m.id, reporter_id: me.id });
      rep.textContent = (!error || error.code === "23505") ? "Reported" : "Failed";
      rep.disabled = true;
    };
    meta.appendChild(rep);
  }
  if (mine || isStaff()) {
    const del = document.createElement("button"); del.textContent = "Delete";
    del.onclick = async () => {
      if (!confirm("Delete this message?")) return;
      const { data, error } = await sb.from("messages").delete().eq("id", m.id).select("id");
      if (error || !data || !data.length) { sysMsg("Could not delete that message"); return; }
      removeMsg(m.id);
    };
    meta.appendChild(del);
  }
  div.append(who, body, meta);
  $("msgs").appendChild(div);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

function leaveChannel() {
  if (channel) { sb.removeChannel(channel); channel = null; }
}

function joinChannel(room) {
  channel = sb.channel("room-" + room.id, { config: { presence: { key: me.id } } });
  channel
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "room_id=eq." + room.id },
      async p => { await nickOf(p.new.author_id); addMsg(p.new); })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "messages", filter: "room_id=eq." + room.id },
      p => { if (p.new.is_hidden) hideMsg(p.new.id); })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "messages" },
      p => removeMsg(p.old.id))
    .on("presence", { event: "sync" }, () => {
      $("online").textContent = Object.keys(channel.presenceState()).length + " online";
    })
    .subscribe(async status => {
      if (status === "SUBSCRIBED") await channel.track({ nickname: me.nickname });
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") sysMsg("Live connection lost. Reconnecting…");
    });
}

async function openChat(room) {
  currentRoom = room;
  $("roomname").textContent = room.name;
  $("online").textContent = "";
  $("msgs").innerHTML = "";
  $("delroom").style.display = (room.created_by === me.id || isStaff()) ? "inline-block" : "none";
  show("chat");
  const { data, error } = await sb.from("messages")
    .select("id, body, created_at, author_id, is_hidden, profiles(nickname)")
    .eq("room_id", room.id).order("id", { ascending: false }).limit(50);
  if (error) { sysMsg(friendly(error)); }
  else data.reverse().forEach(m => { nameCache[m.author_id] = (m.profiles && m.profiles.nickname) || "unknown"; addMsg(m); });
  joinChannel(room);
}

$("back").onclick = () => openRooms();

$("delroom").onclick = async () => {
  if (!currentRoom || !confirm("Delete this room and all its messages?")) return;
  const { data, error } = await sb.from("rooms").delete().eq("id", currentRoom.id).select("id");
  if (error || !data || !data.length) { sysMsg("You are not allowed to delete this room"); return; }
  openRooms();
};

$("send").onsubmit = async e => {
  e.preventDefault();
  const v = $("text").value.trim();
  if (!v || !currentRoom) return;
  $("text").value = "";
  const { data, error } = await sb.from("messages")
    .insert({ room_id: currentRoom.id, author_id: me.id, body: v })
    .select("id, body, created_at, author_id").single();
  if (error) {
    sysMsg(/slow down/i.test(error.message) ? "Slow down a bit" : (me.is_banned ? "Your account is restricted" : "Could not send: " + friendly(error)));
    $("text").value = v;
    return;
  }
  nameCache[me.id] = me.nickname;
  addMsg(data);
};

/* ---------- Admin panel ---------- */
let adminTab = "reports";
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // textContent keeps user text harmless
  return e;
};
function actionBtn(label, cls, fn) {
  const b = el("button", "btn " + cls, label);
  b.onclick = async () => {
    b.disabled = true;
    try { await fn(); } catch (e) { alert(friendly(e)); }
    b.disabled = false;
  };
  return b;
}
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) throw error;
  return data;
}

function openAdmin() {
  $("adminwho").textContent = me.nickname + " (" + me.role + ")";
  $("tabinvites").style.display = me.role === "admin" ? "block" : "none";
  adminTab = "reports";
  show("admin");
  renderAdmin();
}
$("adminbtn").onclick = openAdmin;
$("adminback").onclick = () => openRooms();
document.querySelectorAll(".tabs button").forEach(b => {
  b.onclick = () => { adminTab = b.dataset.tab; renderAdmin(); };
});

function renderAdmin() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === adminTab));
  if (adminTab === "reports") renderReports();
  else if (adminTab === "people") renderPeople();
  else renderInvites();
}

/* Reports tab: messages people reported, worst first */
async function renderReports() {
  const body = $("adminbody");
  body.textContent = "Loading…";
  let rows;
  try { rows = await rpc("admin_reports"); } catch (e) { body.textContent = friendly(e); return; }
  body.innerHTML = "";
  if (!rows.length) { body.appendChild(el("div", "empty", "No reported messages. All quiet.")); return; }
  rows.forEach(r => {
    const n = Number(r.report_count);
    const c = el("div", "card");
    const h = el("h4", "", r.author_nickname + " in " + r.room_name);
    if (r.is_hidden) h.appendChild(el("span", "tag red", "hidden"));
    c.appendChild(h);
    c.appendChild(el("div", "sub", n + " report" + (n === 1 ? "" : "s") + " · " + new Date(r.last_reported).toLocaleString()));
    c.appendChild(el("div", "body", r.body));
    const row = el("div", "row");
    row.appendChild(actionBtn("Delete message", "danger", async () => {
      if (!confirm("Delete this message for everyone?")) return;
      const { data, error } = await sb.from("messages").delete().eq("id", r.message_id).select("id");
      if (error || !data || !data.length) throw new Error("Could not delete that message");
      renderReports();
    }));
    row.appendChild(actionBtn("Keep (dismiss)", "", async () => {
      await rpc("admin_dismiss_reports", { p_message_id: r.message_id });
      renderReports();
    }));
    row.appendChild(actionBtn("Ban author", "danger", async () => {
      if (!confirm("Ban " + r.author_nickname + "? They will not be able to post.")) return;
      await rpc("admin_set_ban", { p_user: r.author_id, p_banned: true });
      alert(r.author_nickname + " is banned");
    }));
    c.appendChild(row);
    body.appendChild(c);
  });
}

/* People tab: search, ban, unban, make moderator */
function renderPeople() {
  const body = $("adminbody");
  body.innerHTML = "";
  const search = el("input");
  search.type = "search"; search.placeholder = "Search nickname"; search.autocomplete = "off";
  const list = el("div");
  body.append(search, list);
  let timer = null;
  async function load() {
    list.textContent = "Loading…";
    let rows;
    try { rows = await rpc("admin_people", { p_search: search.value.trim() }); } catch (e) { list.textContent = friendly(e); return; }
    list.innerHTML = "";
    if (!rows.length) { list.appendChild(el("div", "empty", "Nobody found")); return; }
    rows.forEach(p => {
      const c = el("div", "card");
      const h = el("h4", "", p.nickname);
      if (p.role !== "user") h.appendChild(el("span", "tag", p.role));
      if (p.is_banned) h.appendChild(el("span", "tag red", "banned"));
      c.appendChild(h);
      c.appendChild(el("div", "sub", "Joined " + new Date(p.created_at).toLocaleDateString() + (p.invite_code ? " · code " + p.invite_code : "")));
      const row = el("div", "row");
      const canAct = p.id !== me.id && (p.role === "user" || me.role === "admin");
      if (canAct) {
        row.appendChild(actionBtn(p.is_banned ? "Unban" : "Ban", p.is_banned ? "good" : "danger", async () => {
          if (!p.is_banned && !confirm("Ban " + p.nickname + "?")) return;
          await rpc("admin_set_ban", { p_user: p.id, p_banned: !p.is_banned });
          load();
        }));
      }
      if (me.role === "admin" && p.role !== "admin") {
        row.appendChild(actionBtn(p.role === "moderator" ? "Make normal user" : "Make moderator", "", async () => {
          await rpc("admin_set_role", { p_user: p.id, p_role: p.role === "moderator" ? "user" : "moderator" });
          load();
        }));
      }
      if (row.children.length) c.appendChild(row);
      list.appendChild(c);
    });
  }
  search.oninput = () => { clearTimeout(timer); timer = setTimeout(load, 300); };
  load();
}

/* Invites tab (admins only): make and manage invite codes */
function makeCode() {
  const alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";   // no look-alike letters (0/O, 1/I/L)
  const bytes = new Uint32Array(8);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, x => alphabet[x % alphabet.length]).join("");
}
async function copyInvite(c) {
  const text = "Join me on Mjadala: " + location.origin + "\nInvite code: " + c.code;
  try { await navigator.clipboard.writeText(text); alert("Copied. Paste it into WhatsApp."); }
  catch (_) { prompt("Copy this message:", text); }
}
async function renderInvites() {
  const body = $("adminbody");
  body.textContent = "Loading…";
  const [s1, s2] = await Promise.all([
    sb.from("app_settings").select("invite_required").eq("id", 1).maybeSingle(),
    sb.from("invite_codes").select("code, label, max_uses, uses, is_active, created_at").order("created_at", { ascending: false }),
  ]);
  if (s1.error || s2.error) { body.textContent = friendly(s1.error || s2.error); return; }
  const codes = s2.data || [];
  const required = !!(s1.data && s1.data.invite_required);
  body.innerHTML = "";

  // Switch: require a code to sign up
  const sw = el("div", "card");
  const lab = el("label");
  const cb = el("input"); cb.type = "checkbox"; cb.checked = required; cb.style.marginRight = "8px";
  lab.append(cb, document.createTextNode("Require an invite code to sign up"));
  sw.append(lab, el("div", "sub", required ? "Only people with a valid code can join." : "Anyone can join. Create codes first, then switch this on."));
  cb.onchange = async () => {
    const want = cb.checked;
    const usable = codes.some(c => c.is_active && c.uses < c.max_uses);
    if (want && !usable && !confirm("You have no usable codes, so nobody new could join. Switch on anyway?")) { cb.checked = false; return; }
    const { data, error } = await sb.from("app_settings").update({ invite_required: want }).eq("id", 1).select("id");
    if (error || !data || !data.length) { alert("Could not save the setting"); cb.checked = !want; return; }
    renderInvites();
  };
  body.appendChild(sw);

  // New code
  const nw = el("div", "card");
  nw.appendChild(el("h4", "", "New invite code"));
  const lbl = el("input"); lbl.type = "text"; lbl.placeholder = "Who is it for? e.g. MKSU class A"; lbl.maxLength = 60;
  const max = el("input"); max.type = "number"; max.value = 50; max.min = 1; max.max = 10000;
  nw.append(lbl, el("div", "sub", "How many people can use it?"), max);
  const nrow = el("div", "row");
  nrow.appendChild(actionBtn("Create code", "good", async () => {
    const m = parseInt(max.value, 10);
    if (!(m >= 1 && m <= 10000)) throw new Error("Choose between 1 and 10000 uses");
    const { error } = await sb.from("invite_codes").insert({ code: makeCode(), label: lbl.value.trim(), max_uses: m, created_by: me.id });
    if (error) throw error;
    renderInvites();
  }));
  nw.appendChild(nrow);
  body.appendChild(nw);

  // Existing codes
  if (!codes.length) body.appendChild(el("div", "empty", "No codes yet."));
  codes.forEach(c => {
    const card = el("div", "card");
    card.appendChild(el("div", "code", c.code));
    const h = el("h4", "", c.label || "(no label)");
    if (!c.is_active) h.appendChild(el("span", "tag red", "off"));
    else if (c.uses >= c.max_uses) h.appendChild(el("span", "tag red", "used up"));
    card.appendChild(h);
    card.appendChild(el("div", "sub", c.uses + " of " + c.max_uses + " used"));
    const row = el("div", "row");
    row.appendChild(actionBtn("Copy invite message", "good", () => copyInvite(c)));
    row.appendChild(actionBtn(c.is_active ? "Turn off" : "Turn on", "", async () => {
      const { error } = await sb.from("invite_codes").update({ is_active: !c.is_active }).eq("code", c.code);
      if (error) throw error;
      renderInvites();
    }));
    row.appendChild(actionBtn("Delete", "danger", async () => {
      if (!confirm("Delete code " + c.code + "? People who already joined keep their accounts.")) return;
      const { error } = await sb.from("invite_codes").delete().eq("code", c.code);
      if (error) throw error;
      renderInvites();
    }));
    card.appendChild(row);
    body.appendChild(card);
  });
}

/* ---------- Install as app (PWA) ---------- */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e; $("install").style.display = "inline-block";
});
$("install").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt = null; $("install").style.display = "none";
};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");

/* ---------- Start ---------- */
start().catch(() => show("auth"));
