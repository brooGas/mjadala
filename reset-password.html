<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174d35">
<title>Reset your password — Mjadala</title>
<style>
:root{--green:#174d35;--ivory:#fff1cc;--paper:#fffdf7;--ink:#28332d;--muted:#6e7771;--line:#e5e8df;--soft:#f3f5ee}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(145deg,#e9eee8,#fff8e8);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:20px}
.auth-shell{width:min(100%,430px)}.brand{display:flex;align-items:center;gap:11px;justify-content:center;margin:0 auto 24px;color:var(--green);font-weight:900;font-size:27px;letter-spacing:-.7px}.mark{width:44px;height:44px;border-radius:15px;background:var(--green);color:var(--ivory);display:grid;place-items:center;font-size:23px}
.card{background:var(--paper);border:1px solid #e8e6d9;border-radius:25px;padding:25px;box-shadow:0 20px 55px #203b2918}.card h1{font-size:21px;margin:0 0 7px;text-align:center}.intro{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
label{display:block;font-size:12px;font-weight:750;margin:12px 0 5px}input{width:100%;border:1px solid var(--line);background:white;color:var(--ink);border-radius:11px;padding:13px;font:inherit}
.primary{width:100%;border:0;border-radius:12px;padding:13px;font-weight:850;margin-top:15px;background:var(--green);color:white}
.status{min-height:38px;margin:12px 0 0;color:var(--muted);font-size:12px;text-align:center}
.back{text-align:center;margin-top:16px}.back a{color:var(--green);font-size:13px;font-weight:750;text-decoration:none}
</style>
</head>
<body>
<main class="auth-shell">
 <div class="brand"><span class="mark">MV</span><span>mjadala</span></div>
 <section class="card">
  <h1>Set a new password</h1>
  <p class="intro" id="resetHint">Choose a new password, or a 6-digit PIN if that is easier to remember.</p>
  <form id="resetForm" novalidate>
   <label for="newPassword">New password or PIN</label><input id="newPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="At least 6 characters, e.g. a 6-digit PIN">
   <label for="confirmPassword">Confirm it</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="Type it again">
   <button id="submit" class="primary" type="submit">Save new password</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite"></p>
 </section>
 <div class="back"><a href="/auth.html">← Back to sign in</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
 'use strict';
 const SUPABASE_URL='https://olqwfscmhtdseljvfqvm.supabase.co';
 const SUPABASE_KEY='sb_publishable_Ay8LXBjvNhXQJDKQMF_Etw_SMb6_z4M';
 const $=id=>document.getElementById(id);
 const client=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 if(!client){$('status').textContent='Could not load account services.';return;}
 const status=m=>{$('status').textContent=m||'';};
 client.auth.getSession().then(({data,error})=>{
   if(error||!data?.session) status('This reset link is invalid or has expired. Go back and request a new one.');
 });
 $('resetForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const a=$('newPassword').value, b=$('confirmPassword').value;
  if(a.length<6){status('Use at least 6 characters.');return;}
  if(a!==b){status('The two entries do not match.');return;}
  $('submit').disabled=true; status('Saving…');
  try{
   const{error}=await client.auth.updateUser({password:a});
   if(error)throw error;
   status('Password updated. Opening Mjadala…');
   setTimeout(()=>window.location.replace('/'),900);
  }catch(err){ status(err?.message||'Could not update your password. Request a new reset link and try again.'); $('submit').disabled=false; }
 });
})();
</script>
</body>
</html>
